<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="920" height="560" rx="18" fill="#0f1720"/>
  <text x="460" y="42" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">Raspberry Pi 3B+ — Power Tree (measured)</text>
  <text x="460" y="66" text-anchor="middle" fill="#8b949e" font-size="13">Black probe on GND (GPIO Pin 6)</text>

  <!-- Input -->
  <rect x="30" y="230" width="150" height="90" rx="12" fill="#13261a" stroke="#3fb950" stroke-width="2"/>
  <text x="105" y="262" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">micro-USB</text>
  <text x="105" y="282" text-anchor="middle" fill="#8b949e" font-size="12">J1 PWR IN + polyfuse</text>
  <text x="105" y="306" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">5.0 V ✓</text>

  <line x1="180" y1="275" x2="300" y2="275" stroke="#3fb950" stroke-width="4"/>
  <polygon points="300,267 314,275 300,283" fill="#3fb950"/>
  <text x="240" y="264" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">5VSYS</text>
  <text x="240" y="298" text-anchor="middle" fill="#8b949e" font-size="11">GPIO Pin 2/4 = 5.0 V</text>

  <!-- PEN -->
  <rect x="300" y="110" width="200" height="56" rx="10" fill="#13261a" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="134" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">PEN → GLOBAL_EN</text>
  <text x="400" y="154" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">HIGH ✓ (enabled)</text>
  <line x1="400" y1="166" x2="400" y2="196" stroke="#3fb950" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="392,194 400,208 408,194" fill="#3fb950"/>

  <!-- PMIC -->
  <rect x="316" y="210" width="168" height="130" rx="12" fill="#2a1216" stroke="#f85149" stroke-width="3"/>
  <text x="400" y="248" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="800">MxL7704-R3</text>
  <text x="400" y="270" text-anchor="middle" fill="#8b949e" font-size="12">PMIC · QFN-32 · 5×5 mm</text>
  <text x="400" y="292" text-anchor="middle" fill="#8b949e" font-size="12">4 × Buck + 1 × LDO</text>
  <text x="400" y="322" text-anchor="middle" fill="#f85149" font-size="15" font-weight="800">✗ NOT SWITCHING</text>

  <!-- Outputs -->
  <g font-size="13">
    <g>
      <line x1="484" y1="240" x2="560" y2="120" stroke="#f85149" stroke-width="2.5"/>
      <rect x="560" y="95" width="200" height="52" rx="10" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
      <text x="575" y="117" fill="#e6edf3" font-weight="700">L1 · Buck 1 → 3.3 V</text>
      <text x="575" y="136" fill="#8b949e" font-size="11">GPIO, SD card, I/O</text>
      <text x="780" y="128" fill="#f85149" font-size="18" font-weight="800">0.00 V</text>
    </g>
    <g>
      <line x1="484" y1="262" x2="560" y2="215" stroke="#f85149" stroke-width="2.5"/>
      <rect x="560" y="190" width="200" height="52" rx="10" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
      <text x="575" y="212" fill="#e6edf3" font-weight="700">L2 · Buck 2 → 1.8 V</text>
      <text x="575" y="231" fill="#8b949e" font-size="11">Interfaces / aux</text>
      <text x="780" y="223" fill="#f85149" font-size="18" font-weight="800">0.00 V</text>
    </g>
    <g>
      <line x1="484" y1="290" x2="560" y2="310" stroke="#f85149" stroke-width="2.5"/>
      <rect x="560" y="285" width="200" height="52" rx="10" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
      <text x="575" y="307" fill="#e6edf3" font-weight="700">L3 · Buck 3 → 1.2 V</text>
      <text x="575" y="326" fill="#8b949e" font-size="11">LPDDR2 RAM</text>
      <text x="780" y="318" fill="#f85149" font-size="18" font-weight="800">0.00 V</text>
    </g>
    <g>
      <line x1="484" y1="318" x2="560" y2="405" stroke="#f85149" stroke-width="2.5"/>
      <rect x="560" y="380" width="200" height="52" rx="10" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
      <text x="575" y="402" fill="#e6edf3" font-weight="700">L4 · Buck 4 → ~1.2 V</text>
      <text x="575" y="421" fill="#8b949e" font-size="11">SoC core</text>
      <text x="780" y="413" fill="#f85149" font-size="18" font-weight="800">0.00 V</text>
    </g>
  </g>

  <!-- Short check -->
  <rect x="30" y="400" width="420" height="70" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="48" y="428" fill="#d29922" font-size="14" font-weight="700">Short-circuit check (power off)</text>
  <text x="48" y="452" fill="#e6edf3" font-size="13">3.3 V ↔ GND = 59.9 Ω … 143.4 Ω  →  no dead short ✓</text>

  <!-- Verdict -->
  <rect x="30" y="490" width="860" height="48" rx="12" fill="#f85149"/>
  <text x="460" y="520" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Input OK · Enable OK · No short · All outputs 0.00 V  ⇒  PMIC failed internally</text>
</svg>
